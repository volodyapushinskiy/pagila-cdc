version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: cdc-postgres
    env_file: .env
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/00-pre.sql:/docker-entrypoint-initdb.d/00-pre.sql
      - ./pagila-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./pagila-data.sql:/docker-entrypoint-initdb.d/02-data.sql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/03-init.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagila_user -d pagila"]
      interval: 10s
      retries: 5
    networks: [cdc-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cdc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [cdc-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cdc-kafka
    depends_on: [zookeeper]
    ports: ["29092:29092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      retries: 5
    networks: [cdc-net]

  kafka-connect:
    image: debezium/connect:2.4
    container_name: cdc-debezium
    depends_on:
      kafka:    {condition: service_healthy}
      postgres: {condition: service_healthy}
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-group
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    volumes:
      - ./debezium/connector.json:/debezium/connector.json
      - ./debezium/register-connector.sh:/debezium/register-connector.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 15s
      retries: 5
    networks: [cdc-net]

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: cdc-clickhouse
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      retries: 5
    networks: [cdc-net]

  airflow:
    build: ./airflow
    container_name: cdc-airflow
    depends_on:
      postgres:   {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    ports: ["8088:8080"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pagila_user:pagila_pass@cdc-postgres/airflow_meta
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_HOST: cdc-clickhouse
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark:/opt/spark_jobs
    command: >
      bash -c "
        until pg_isready -h cdc-postgres -U pagila_user; do sleep 2; done;
        PGPASSWORD=pagila_pass psql -h cdc-postgres -U pagila_user -d pagila -c 'CREATE DATABASE airflow_meta;' 2>/dev/null || true;
        airflow db init;
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@local.com 2>/dev/null || true;
        airflow webserver & airflow scheduler
      "
    networks: [cdc-net]

networks:
  cdc-net:
    driver: bridge

volumes:
  postgres_data: